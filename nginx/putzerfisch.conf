# Putzerfisch – nginx-Config (final, mit HTTPS).
#
#   sudo cp nginx/putzerfisch.conf /etc/nginx/sites-available/putzerfisch
#   sudo nano /etc/nginx/sites-available/putzerfisch   # Domain ersetzen
#   sudo nginx -t && sudo systemctl reload nginx
#
# Voraussetzung: Zertifikat existiert bereits und deckt Apex + www ab
# (sonst zeigt der Browser für www einen Zertifikatsfehler):
#   sudo certbot certonly --webroot -w /var/www/certbot \
#       -d putzapp.example.com -d www.putzapp.example.com --expand
# nginx startet NICHT, solange die ssl_certificate-Dateien fehlen.

server {
    listen 80;
    listen [::]:80;
    server_name putzapp.example.com www.putzapp.example.com;   # <-- DEINE DOMAIN

    # Wird auch nach dem Renewal noch gebraucht (webroot-Methode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> Apex umleiten (canonical URL bleibt putzapp.example.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.putzapp.example.com;

    ssl_certificate     /etc/letsencrypt/live/putzapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/putzapp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://putzapp.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name putzapp.example.com;   # <-- DEINE DOMAIN

    ssl_certificate     /etc/letsencrypt/live/putzapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/putzapp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Fotos kommen als base64-JSON im Body – Express erlaubt bis 4 MB
    client_max_body_size 6m;

    # App (Docker-Container, nur auf localhost published)
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Riffpost-Dauerleitung (Server-Sent Events): nie puffern, lange offen halten
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
