# Putzerfisch – nginx-Config für den ERSTSTART (nur HTTP).
#
# Zweck: nginx läuft auf Port 80, damit certbot die Let's-Encrypt-Challenge
# beantworten kann. Sobald das Zertifikat existiert, wird diese Datei durch
# putzerfisch.conf (mit HTTPS-Block) ersetzt – Details in SETUP.md.
#
#   sudo cp nginx/putzerfisch-http.conf /etc/nginx/sites-available/putzerfisch
#   sudo nano /etc/nginx/sites-available/putzerfisch   # Domain ersetzen
#   sudo ln -s /etc/nginx/sites-available/putzerfisch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name putzapp.example.com www.putzapp.example.com;   # <-- DEINE DOMAIN

    # Let's-Encrypt-Challenge (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
